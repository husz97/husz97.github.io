<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love-Message &hearts;</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts: Patrick Hand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" href="./assets/heart-svgrepo-com.svg">

<body>

    <!-- Background Layer -->
    <div class="bg"></div>

    <div class="main">
        <div class="paper paper1">
            <img src="./assets/heart-svgrepo-com.svg" alt="">

        <div class="paper paper2">
            <p>1 Month with you</p>

        </div>
        <div class="paper paper4">

            <p>พี่มีความสุขมากจนถึงวันที่เราตัดสินใจคบกัน</p>
        </div>
        <div class="paper paper5">
            <p>รักเธอมากนะ</p>
            <p>ตั้งใจทำมากด้วยไม่รู้เธอจะชอบไหม &hearts;</p>
        </div>
        <div class="paper paper6">
            <img src="./assets/sakshi_1.JPG" alt="Sakshi, I Love U ">
        </div>
        <div class="paper paper7">
            <img src="./assets/sakshi_2.JPG" alt="Sakshi, I Love U ">
        </div>
        <div class="paper paper8">
            <img src="./assets/sakshi_3.JPG" alt="Sakshi, I Love U ">
        </div>
        <div class="paper paper9">
            <img src="./assets/sakshi_4.JPG" alt="Sakshi, I Love U ">
        </div>
        <div class="paper paper10">
            <img src="./assets/sakshi_5.JPG" alt="Sakshi, I Love U ">
        </div>
    </div>
    
    <footer>
        <a href="https://github.com/Anujesh-Ansh" target="_blank">
            <p>Made with &hearts; by Anujesh</p>
        </a>
    </footer>

    <script src="script.js"></script>

</html>
